name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # requirements.txt is hash-locked — pip-audit verifies the exact pinned versions
      # actually shipped to production, not just what requirements.in allows.
      - run: pip-audit -r requirements.txt

  docker-build:
    name: Docker build & image scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # v3 -> v4: routine major bump, verified via GitHub API (not a scraped page).
      # Breaking changes in v4.0.0 (Node 24 runtime, removed deprecated inputs) don't
      # apply here — this step passes no `with:` inputs and ubuntu-latest already has
      # a current Node runtime. Pinned by commit SHA per the trivy-action lesson above.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: fastapi-onion-ddd-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for OS/library vulnerabilities
        # Pinned to a commit SHA, not a mutable version tag — aquasecurity/trivy-action
        # had a supply-chain compromise on 2026-03-19 where an attacker force-pushed
        # nearly every existing version tag (0.0.1-0.34.2, which covered the previous
        # @0.24.0 pin here) to malicious commits that stole CI secrets. v0.36.0 postdates
        # the fix and GitHub's immutable-releases protection; SHA verified independently
        # via the GitHub API (tag ref -> tag object -> commit), not by trusting a scraped
        # page. See https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastapi-onion-ddd-template:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Report-only by default (exit-code 0) so a template fork isn't red on day one
          # because of upstream base-image CVEs. Tighten to "1" once you're tracking these.
          exit-code: "0"
      - name: Upload scan results to the Security tab
        # v3 -> v4.37.4: v3 is slated for deprecation (Dec 2026 per GitHub's changelog).
        # Only breaking change across the whole v3->v4 line is a Node.js 24 runtime bump
        # (irrelevant on ubuntu-latest). Commit verified via GitHub API: the tag object
        # itself is unsigned (normal for codeql-action's bot-driven release process), but
        # the commit it points to is GPG-verified and a legitimate merge from a real
        # @github.com author into releases/v4 (PR #4053).
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: trivy-results.sarif
