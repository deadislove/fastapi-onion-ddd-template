name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # requirements.txt is hash-locked — pip-audit verifies the exact pinned versions
      # actually shipped to production, not just what requirements.in allows.
      - run: pip-audit -r requirements.txt

  docker-build:
    name: Docker build & image scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: fastapi-onion-ddd-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for OS/library vulnerabilities
        # Pinned to a commit SHA, not a mutable version tag — aquasecurity/trivy-action
        # had a supply-chain compromise on 2026-03-19 where an attacker force-pushed
        # nearly every existing version tag (0.0.1-0.34.2, which covered the previous
        # @0.24.0 pin here) to malicious commits that stole CI secrets. v0.36.0 postdates
        # the fix and GitHub's immutable-releases protection; SHA verified independently
        # via the GitHub API (tag ref -> tag object -> commit), not by trusting a scraped
        # page. See https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fastapi-onion-ddd-template:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Report-only by default (exit-code 0) so a template fork isn't red on day one
          # because of upstream base-image CVEs. Tighten to "1" once you're tracking these.
          exit-code: "0"
      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
