[mypy]
python_version = 3.11
files = app
exclude = ^tests/

# Pragmatic, not --strict: the codebase already type-hints everything, so this
# mostly just verifies those hints are internally consistent rather than forcing
# a large upfront rewrite. Tighten incrementally (e.g. disallow_untyped_defs on
# more modules, then eventually --strict) as the template matures.
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# Third-party libraries without bundled or stub-package type information.
[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
